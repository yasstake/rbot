[package]
name = "rbot"
version = "0.1.8"       # for test pypi
# version = "0.4.0"     # for main release branch
edition = "2021"
exclude = ["test/**"]

[lib]
name = "rbot"
crate-type = ["cdylib", "rlib"]

[dependencies]
bybit = {path = "exchanges/bybit"}
binance = {path = "exchanges/binance"}
bitbank = {path= "exchanges/bitbank"}
# hyperliquid = {path = "exchanges/hyperliquid"}

rbot_lib = {path="modules/rbot_lib"}
rbot_session = {path="modules/rbot_session"}
rbot_server = {path="modules/rbot_server"}
rbot_market = {path="modules/rbot_market"}
pyo3 = { workspace = true, features = ["extension-module"] }


[workspace]


members = [
    "modules/rbot_lib",
    "modules/rbot_market",
    "modules/rbot_session",
    "modules/rbot_server",
    "modules/rbot_blockon",
    "modules/rbot_server",
    "modules/rbot_blockon",
    "exchanges/bitbank",
    "exchanges/bitflyer",
    "exchanges/bybit",
    # "exchanges/hyperliquid",
]

resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
rbot_lib = {path="modules/rbot_lib"}
rbot_session = {path="modules/rbot_session"}
rbot_server = {path="modules/rbot_server"}
rbot_market = {path="modules/rbot_market"}
rbot_blockon = {path="modules/rbot_blockon"}


bitbank = { path = "./exchanges/bitbank" }
bitflyer = { path = "./exchanges/bitflyer" }
bybit = { path = "./exchanges/bybit" }
binance = { path = "./exchanges/binance" }
# hyperliquid = { path = "./exchanges/hyperliquid" }

anyhow = { version = "1" }

features = {version = "0.10.0"}

chrono = { version = "0.4" }
serde = { version = "1.0"}
serde_json = { version = "1.0" }
serde_derive = { version = "1.0" }
serde_with = { version = "3" }

json5 = { version = "0.4.1" }

log = { version = "0.4" }
env_logger = { version = "0.11" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

env-file-reader = { version="0.3.0" }

directories = {version= "6" }

crossbeam-channel = { version = "0.5" }

thiserror = { version = "2" }

strum_macros = { version = "0.27" }
strum = { version = "0.27", features = ["derive"] }

async-stream = { version = "0.3" }

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1" }
async-trait = {version="0.1"}

rusqlite = { version = "0.39.0", features = ["bundled"] }

polars = { version = "0.53.0", features = [
        "lazy",
        "ndarray",
        "dtype-time",
        "object",
        "round_series",
        "temporal",
        "pivot",
        "dynamic_group_by",
        "cum_agg",
        "serde",
        "list_to_struct",
        "decompress",
        "parquet",
        ]}

polars-lazy = {version = "0.53.0"}
polars-io = {version = "0.53.0", features=["avro", "parquet"]}
pyo3-polars = {version = "0.26.0"}
polars-arrow = {version = "0.53.0"}
arrow = {version = "58.3.0"}

parquet = "58.3.0"

numpy = { version = "0.27" }

ndarray = { version = "0.16" }

reqwest = { version = "0.12", features = ["blocking", "gzip", "stream"] }
futures = { version = "0.3" }
flate2 = { version = "1" }
#async-compression = {version="0.4.23", features = ["all"] }

csv = { version = "1" }
zip = { version = "3" }

tempfile = { version = "3" }

openssl = { version = "0.10", features = ["vendored"] }

url = { version = "2" }

rust_decimal = { version = "1" }
rust_decimal_macros = { version = "1" }

hmac = { version = "0.12" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }

tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

async-std = { version = "1", features = ["attributes"] }

socket2 = { version = "0.5" }
rmp-serde = { version = "1" }
once_cell = { version = "1" }

actix-web={version="4"}
actix-rt={version="2"}

pubnub = { version = "0.6.0" }

pyo3 = { version = "0.27", features = ["rust_decimal", "abi3-py38", "anyhow", "extension-module"] }


